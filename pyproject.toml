[project]
name = "mahara-match"
version = "0.1.0"
description = "Architecture scaffold for the Mahara Match modular monolith"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "djangorestframework-simplejwt>=5.5,<6",
    "drf-spectacular>=0.28,<0.29",
    "lingua-language-detector>=2.2.0",
    "playwright>=1.63.0",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.2.4",
    "seleniumbase>=4.55.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-django",
    "pytest-cov",
    "coverage[toml]",
    "pre-commit",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs>=3.16,<3.17",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "ai", "pipelines"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
namespace_packages = true
explicit_package_bases = true
exclude = '(^|/)(\.venv|build|dist)/'

[tool.django-stubs]
django_settings_module = "backend.config.settings.test"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-config --strict-markers"
django_find_project = false
DJANGO_SETTINGS_MODULE = "backend.config.settings.test"
pythonpath = ["."]
markers = [
    "unit: isolated behavior without external services",
    "integration: collaboration across modules or storage adapters",
    "e2e: complete user journeys through application boundaries",
]
# Add DJANGO_SETTINGS_MODULE only when real Django test settings exist.

[tool.coverage.run]
branch = true
source = ["backend", "ai", "pipelines"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"
