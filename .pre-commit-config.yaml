repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and import sorting
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy .
        language: system
        types_or: [python, pyi]
        pass_filenames: false
